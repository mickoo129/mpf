[build]
  base    = "."
  command = "pnpm --filter @workspace/api-server run build && ([ -n \"$DATABASE_URL\" ] && pnpm --filter @workspace/db run push --force || true) && pnpm --filter @workspace/mpf-compare run build"
  publish = "artifacts/mpf-compare/dist/public"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10"
  BASE_PATH    = "/"

[functions]
  directory    = "netlify/functions"
  node_bundler = "nft"

[[redirects]]
  from  = "/api/*"
  to    = "/.netlify/functions/api"
  status = 200
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
