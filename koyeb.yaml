name: mpf-api
services:
  - name: api
    type: web
    instance_type: nano
    regions:
      - sin
    git:
      repository: github.com/mickoo129/mpf
      branch: main
    build:
      builder: buildpack
      build_command: pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
      run_command: pnpm --filter @workspace/db run push --force && pnpm --filter @workspace/api-server run start
    env:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        secret: true
      - key: SESSION_SECRET
        secret: true
    ports:
      - port: 8000
        protocol: http
    health_checks:
      - path: /api/healthz
        port: 8000
        interval: 30
        timeout: 5
