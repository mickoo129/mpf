kind = "web"
previewPath = "/"
title = "MPF Compare"
version = "1.0.0"
id = "artifacts/mpf-compare"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18602

[services.development]
run = "pnpm --filter @workspace/mpf-compare run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mpf-compare", "run", "build" ]
publicDir = "artifacts/mpf-compare/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18602"
BASE_PATH = "/"
